name: Deploy web build to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Check and export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` rather than `npm install`: the lockfile pins react-dom to
      # exactly 19.2.3, which a caret range would resolve past into a peer
      # conflict with react 19.2.3.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # A Pages project site is served from a sub-path, and this Expo CLI reads
      # the base path only from the app config — hence app.config.ts and this
      # environment variable rather than a CLI flag.
      - name: Export web build
        env:
          PAGES_BASE_URL: /${{ github.event.repository.name }}
        run: npx expo export --platform web --output-dir dist

      # Single-page export, so Pages needs a fallback for any path it cannot
      # match; 404.html is a copy of the shell and the router takes over from
      # there. .nojekyll is belt-and-braces: Jekyll does not run on
      # Actions-based deployments, so `_expo/` would be served regardless.
      - name: Add single-page fallback
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Configure Pages
        if: github.ref_name == github.event.repository.default_branch
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    # Compared at run time against whatever the default branch is, so renaming
    # it or introducing a main later does not silently stop deployments.
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
